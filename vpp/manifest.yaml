manifestVersion: 1
name: "@lstrandos/vpp"
version: "2026.11.25.4"
license: Apache-2.0
visibility: private
repository: "https://github.com/larsstrandos/swamp-extensions"
description: >-
  Read-only diagnostics for fd.io VPP nodes through vppctl (local, docker/podman
  exec or SSH): health findings, interfaces with linux-cp names, VRF/FIB tables,
  neighbors and error counters with deltas, plus a Claude skill for using them.
behaviors:
  - vpp.ts
skills:
  - vpp-diagnostics
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - vpp
  - fdio
  - networking
  - linux-cp
  - diagnostics
